<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FAF5EA">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&display=swap" rel="stylesheet">
<title>清邁 30 天</title>
<style>
:root {
  --cream: #FAF5EA;
  --card: #FFFDF8;
  --ink: #4A3A2A;
  --muted: #8C7B68;
  --line: #E8DCC6;
  --mustard: #D9A43A;
  --mustard-soft: #F6EACB;
  --brick: #C25B43;
  --brick-soft: #F5E1DA;
  --olive: #7F9157;
  --olive-soft: #E8EDDC;
  --slate: #5B6C8F;
  --slate-soft: #E3E7EF;
  --teal: #5E9C94;
  --teal-soft: #DDEDEA;
  --radius: 18px;
  --hand: "LXGW WenKai TC", "Klee One", "PingFang TC", serif;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background-color: var(--cream);
  background-image:
    radial-gradient(circle at 20% 30%, rgba(140, 123, 104, .10) 1px, transparent 1.5px),
    radial-gradient(circle at 70% 80%, rgba(194, 91, 67, .08) 1px, transparent 1.5px),
    radial-gradient(circle at 40% 60%, rgba(217, 164, 58, .12) 1.2px, transparent 1.8px);
  background-size: 37px 41px, 53px 47px, 71px 67px;
  color: var(--ink);
  font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "Noto Sans TC",
    "Microsoft JhengHei", sans-serif;
  line-height: 1.6;
}
button { font: inherit; color: inherit; }
a { color: inherit; }
[hidden] { display: none !important; }
.wrap { max-width: 760px; margin: 0 auto; padding: 0 16px; }

/* ---------- 封面 ---------- */
.cover {
  position: relative;
  overflow: hidden;
  color: var(--ink);
  border-bottom: 2px dashed var(--line);
  padding: 44px 0 40px;
}
.cover svg.deco { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.cover .wrap { position: relative; }
.eyebrow { font-size: 12px; letter-spacing: .22em; font-weight: 700; color: var(--brick); }
.cover h1 {
  font-size: clamp(40px, 12vw, 64px);
  line-height: 1.05;
  margin: 10px 0 12px;
  font-family: var(--hand);
  font-weight: 700;
  letter-spacing: .04em;
}
.cover p { margin: 0; max-width: 22em; font-size: 15px; color: var(--muted); }

/* ---------- 星期篩選 ---------- */
.daybar {
  position: sticky;
  top: 0;
  z-index: 10;
  background: rgba(250, 245, 234, .95);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  border-bottom: 1px solid var(--line);
}
.daybar .wrap { padding-top: 10px; padding-bottom: 10px; }
.daybar-label { font-size: 12px; color: var(--muted); margin-bottom: 6px; }
.days { display: flex; gap: 6px; }
.day {
  position: relative;
  flex: 1 1 0;
  min-width: 0;
  border: 1.5px solid var(--line);
  background: var(--card);
  border-radius: 12px;
  padding: 7px 0;
  font-size: 14px;
  font-weight: 700;
  cursor: pointer;
}
.day.any { flex: 1.6 1 0; }
.day.today::after {
  content: "";
  position: absolute;
  top: 4px;
  right: 4px;
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--brick);
}
.day[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: #fff; }

/* ---------- 首頁分類入口 ---------- */
.home { padding: 18px 0 40px; }
.tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.tile {
  text-align: left;
  border: 0;
  border-radius: var(--radius);
  padding: 16px 16px 14px;
  min-height: 150px;
  display: flex;
  flex-direction: column;
  cursor: pointer;
  border: 1.5px solid rgba(74, 58, 42, .08);
  transition: transform .15s;
}
.tile:active { transform: scale(.98); }
.tile.wide { grid-column: span 2; min-height: 110px; }
.tile-icon {
  width: 48px;
  height: 48px;
  border-radius: 50%;
  background: var(--tile-accent);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-size: 24px;
  line-height: 1;
}
.tile-name { font-family: var(--hand); font-size: 23px; font-weight: 700; margin-top: 10px; }
.tile-en { font-size: 10px; letter-spacing: .18em; font-weight: 700; color: var(--tile-accent); }
.tile-intro { font-size: 12px; margin-top: 6px; color: var(--muted); flex: 1; }
.tile-count { font-size: 12px; font-weight: 800; margin-top: 8px; }
.tile-count b { font-size: 20px; margin-right: 2px; color: var(--tile-accent); }

.tips {
  margin-top: 18px;
  padding: 14px 16px;
  background: var(--card);
  border: 1.5px dashed var(--line);
  border-radius: var(--radius);
  font-size: 13px;
  color: var(--muted);
}

/* ---------- 分類頁 ---------- */
.cat-head { padding: 18px 0 20px; }
.back {
  border: 0;
  background: rgba(255,255,255,.7);
  border-radius: 99px;
  padding: 5px 12px;
  font-size: 13px;
  font-weight: 700;
  cursor: pointer;
}
.cat-head h2 { margin: 12px 0 2px; font-family: var(--hand); font-size: 32px; font-weight: 700; line-height: 1.2; }
.cat-head p { margin: 0; font-size: 13px; color: var(--muted); }

.chips { display: flex; gap: 7px; overflow-x: auto; padding: 14px 0 4px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip {
  border: 1.5px solid var(--line);
  background: var(--card);
  border-radius: 99px;
  padding: 6px 13px;
  font-size: 13px;
  white-space: nowrap;
  cursor: pointer;
}
.chip[aria-pressed="true"] { font-weight: 800; }
.cuisine-chips { padding-top: 6px; }
.cuisine-chips .chip { font-size: 12px; padding: 4px 11px; }

.result { font-size: 12px; color: var(--muted); margin: 10px 2px; }
.cards { display: grid; gap: 10px; padding-bottom: 16px; }
.card {
  display: block;
  width: 100%;
  text-align: left;
  background: var(--card);
  border: 0;
  border-radius: 14px;
  padding: 14px 14px 12px 14px;
  cursor: pointer;
  box-shadow: 0 2px 10px rgba(74, 58, 42, .06);
}
.card { display: flex; gap: 12px; align-items: stretch; }
.card-body { flex: 1; min-width: 0; }
.thumb {
  flex: none;
  width: 112px;
  min-height: 112px;
  border-radius: 12px;
  overflow: hidden;
  background: var(--soft);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 30px;
}
.thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.card-title { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
.card h3 { margin: 0; font-size: 15px; line-height: 1.4; color: var(--ink); }
.card h3 .en { margin-left: 6px; font-size: 13px; font-weight: 600; color: var(--muted); }
.card .arrow { color: var(--muted); font-size: 18px; flex: none; }
.card .thai { font-size: 12px; color: var(--muted); }
.card .one {
  margin: 6px 0 8px;
  font-size: 13px;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.card-foot { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.tags { display: flex; gap: 5px; flex-wrap: wrap; }
.tag {
  font-size: 11px;
  border-radius: 6px;
  padding: 2px 7px;
  background: var(--soft);
  color: var(--ink);
  font-weight: 600;
}
.tag.bib { background: var(--brick); color: #fff; }
.tag.selected { background: var(--mustard); color: #fff; }
.tag.extra { background: #EFE7DA; color: var(--muted); }

.foot-right { display: flex; align-items: center; gap: 8px; margin-left: auto; }
.price-level { font-style: normal; font-weight: 800; font-size: 14px; color: var(--accent); letter-spacing: 1px; white-space: nowrap; }
.price-level i { font-style: normal; }
.price-level i.off { color: var(--line); }
.head-bar { display: flex; justify-content: space-between; align-items: center; }
.price-legend { display: grid; gap: 8px; font-size: 14px; }
.legend-dialog {
  border: 0;
  border-radius: 18px;
  padding: 18px 20px;
  width: min(92vw, 380px);
  background: var(--card);
  color: var(--ink);
}
.legend-dialog::backdrop { background: rgba(74, 58, 42, .45); }
.legend-title { display: flex; justify-content: space-between; align-items: center; font-weight: 800; font-size: 16px; margin-bottom: 12px; }
.legend-close { border: 0; background: var(--cream); width: 30px; height: 30px; border-radius: 50%; cursor: pointer; }
.legend-close:focus { outline: none; }
.legend-note { margin: 12px 0 0; font-size: 12px; color: var(--muted); }
.legend-row { display: grid; grid-template-columns: 44px 52px 1fr; align-items: center; gap: 6px; }
.legend-row span:last-child { color: var(--muted); }
.day-tag {
  display: inline-block;
  font-size: 12px;
  font-weight: 800;
  border-radius: 6px;
  padding: 1px 8px;
  border: 1.5px solid var(--accent);
  color: var(--accent);
  background: var(--card);
  white-space: nowrap;
}
.week-tag {
  display: inline-flex;
  gap: 4px;
  vertical-align: middle;
}
.week-tag span {
  width: 22px;
  height: 22px;
  border-radius: 50%;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-size: 11px;
  font-weight: 700;
  background: #F1EADF;
  color: #C4B6A3;
}
.week-tag span.on { background: var(--accent); color: #fff; }
.day-tag.unknown { border-color: var(--line); color: var(--muted); font-weight: 600; }

.empty {
  text-align: center;
  padding: 36px 16px;
  color: var(--muted);
  font-size: 14px;
  background: var(--card);
  border-radius: var(--radius);
}
.empty .big { font-size: 36px; }
.notice {
  margin: 6px 0 40px;
  padding: 12px 14px;
  border-radius: 12px;
  background: var(--mustard-soft);
  font-size: 12px;
  color: #6E5626;
}

/* ---------- 地點頁 ---------- */
.hero {
  position: relative;
  height: 260px;
  background: var(--soft);
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
}
.hero img { width: 100%; height: 100%; object-fit: cover; display: block; }
.hero .hero-icon { font-size: 72px; opacity: .8; }
.hero .back {
  position: absolute;
  top: 14px;
  left: 14px;
  background: rgba(255, 253, 248, .92);
  box-shadow: 0 2px 8px rgba(74, 58, 42, .15);
}
.hero-credit {
  position: absolute;
  right: 8px;
  bottom: 6px;
  font-size: 10px;
  color: #fff;
  text-shadow: 0 1px 2px rgba(0,0,0,.6);
}
.place { padding-top: 18px; padding-bottom: 40px; }
.place h1 { margin: 10px 0 2px; font-size: 21px; line-height: 1.35; }
.place h1 .en { margin-left: 6px; font-size: 15px; font-weight: 600; color: var(--muted); }
.place .thai { font-size: 13px; color: var(--muted); }
.place .desc { margin: 14px 0 0; font-size: 15px; }
.block { margin-top: 18px; }
.block-title { font-size: 12px; font-weight: 800; letter-spacing: .1em; color: var(--accent); margin-bottom: 7px; }
.pills { display: flex; flex-wrap: wrap; gap: 7px; }
.pill {
  font-size: 14px;
  font-weight: 700;
  padding: 5px 12px;
  border-radius: 99px;
  background: var(--soft);
  color: var(--ink);
}
.pill.dish { background: var(--card); border: 1.5px solid var(--accent); color: var(--accent); }
.friend-note {
  margin-top: 18px;
  padding: 12px 14px;
  border-radius: 12px;
  background: var(--mustard-soft);
  font-size: 14px;
}
.friend-note b { margin: 0 6px 0 4px; }
.info {
  margin-top: 20px;
  padding: 14px 16px;
  background: var(--card);
  border-radius: 14px;
  display: grid;
  gap: 10px;
  font-size: 14px;
}
.info-row { display: grid; grid-template-columns: 24px 1fr; gap: 8px; align-items: center; }
.info-row > span:first-child { text-align: center; }
.btns { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 20px; }
.btn {
  flex: 1 1 140px;
  text-align: center;
  text-decoration: none;
  padding: 13px;
  border-radius: 12px;
  font-weight: 800;
  font-size: 14px;
  background: var(--accent);
  color: #fff;
}
.btn.ghost { background: var(--card); color: var(--ink); border: 1.5px solid var(--line); }

footer { text-align: center; font-size: 11px; color: var(--muted); padding: 0 16px 32px; }

@media (min-width: 700px) {
  .cards { grid-template-columns: 1fr 1fr; }
  .tile { min-height: 170px; }
}
</style>
</head>

const state = { day: null, group: null, cuisine: null };
const todayIndex = new Date().getDay();
const $ = (selector) => document.querySelector(selector);

function isOpenOn(place, day) {
  if (day === null || !place.days) return true;
  return place.days.includes(day);
}

function placesOf(catKey) {
  return PLACES.filter((place) => place.cat === catKey && isOpenOn(place, state.day));
}

function renderDays() {
  const options = [{ value: null, label: '不限' }].concat(
    WEEK_ORDER.map((day) => ({ value: day, label: DAY_LABELS[day] }))
  );
  $('#days').innerHTML = options.map((option) => {
    const classes = ['day'];
    if (option.value === null) classes.push('any');
    if (option.value === todayIndex) classes.push('today');
    const pressed = option.value === state.day;
    return `<button class="${classes.join(' ')}" data-day="${option.value}" aria-pressed="${pressed}">${option.label}</button>`;
  }).join('');

  const label = state.day === null
    ? '哪天出門？選一天只看有開的'
    : `週${DAY_LABELS[state.day]}${state.day === todayIndex ? '（今天）' : ''}有開的地方`;
  $('#day-label').textContent = label;
}

function renderTiles() {
  $('#tiles').innerHTML = Object.entries(CATEGORIES).map(([key, cat]) => {
    const count = placesOf(key).length;
    const countText = count ? `<b>${count}</b> 個地點` : '還沒有資料';
    return `
      <button class="tile" data-cat="${key}" style="background:${cat.soft};--tile-accent:${cat.accent}">
        <span class="tile-icon">${cat.icon}</span>
        <span class="tile-name">${cat.name}</span>
        <span class="tile-en">${cat.en}</span>
        <span class="tile-intro">${cat.intro}</span>
        <span class="tile-count">${countText}</span>
      </button>`;
  }).join('');
}

function dayText(days) {
  if (days.length === 7) return '每天';
  const runs = [];
  WEEK_ORDER.forEach((day) => {
    if (!days.includes(day)) return;
    const lastRun = runs[runs.length - 1];
    const prevDay = lastRun && lastRun[lastRun.length - 1];
    const isConsecutive = lastRun && WEEK_ORDER.indexOf(prevDay) === WEEK_ORDER.indexOf(day) - 1;
    if (isConsecutive) {
      lastRun.push(day);
    } else {
      runs.push([day]);
    }
  });
  return runs.map((run) => {
    const labels = run.map((day) => DAY_LABELS[day]);
    return run.length >= 3 ? `${labels[0]}～${labels[labels.length - 1]}` : labels.join('、');
  }).join('、');
}

function weekDots(place) {
  if (!place.days) return '<span class="day-tag unknown">營業日待確認</span>';
  return `<span class="day-tag">${dayText(place.days)}</span>`;
}

function weekCircles(place) {
  if (!place.days) return '<span class="day-tag unknown">營業日待確認</span>';
  const circles = WEEK_ORDER.map((day) => {
    const on = place.days.includes(day) ? ' class="on"' : '';
    return `<span${on}>${DAY_LABELS[day]}</span>`;
  }).join('');
  return `<span class="week-tag">${circles}</span>`;
}

function hoursOnly(time) {
  const times = time.match(/\d{1,2}:\d{2}/g) || [];
  if (times.length === 1) return `${times[0]} 起`;
  const ranges = [];
  for (let index = 0; index + 1 < times.length; index += 2) {
    ranges.push(`${times[index]}~${times[index + 1]}`);
  }
  return [...new Set(ranges)].join('、');
}

function thumbHtml(place, cat) {
  const image = IMAGES[place.name];
  if (!image || !image.url) return `<span class="thumb">${cat.icon}</span>`;
  return `<span class="thumb"><img src="${image.url}" alt="" loading="lazy" onerror="this.remove()"></span>`;
}

function priceLevel(place) {
  if (!place.level) return '';
  const symbols = [1, 2, 3].map((step) => `<i${step > place.level ? ' class="off"' : ''}>฿</i>`).join('');
  return `<span class="price-level" title="${PRICE_LEVELS[place.level - 1].label}">${symbols}</span>`;
}

function tagHtml(place) {
  const tags = [];
  if (place.bib) tags.push('<span class="tag bib">必比登</span>');
  if (place.group === '米其林推薦') tags.push('<span class="tag selected">米其林推薦</span>');
  if (place.group === '其他推薦') tags.push('<span class="tag extra">其他推薦</span>');
  place.tags.forEach((tag) => tags.push(`<span class="tag">${tag}</span>`));
  return tags.join('');
}

function renderCategory(catKey) {
  const cat = CATEGORIES[catKey];
  const root = document.documentElement;
  root.style.setProperty('--accent', cat.accent);
  root.style.setProperty('--soft', cat.soft);

  const head = $('#cat-head');
  head.style.background = cat.soft;
  head.style.borderBottom = `2px dashed ${cat.accent}55`;
  $('#cat-title').textContent = `${cat.icon} ${cat.name}`;
  $('#cat-intro').textContent = cat.intro;

  const chips = $('#chips');
  chips.hidden = cat.groups.length === 0;
  chips.innerHTML = [null].concat(cat.groups).map((group) => {
    const pressed = group === state.group;
    const style = pressed ? `style="background:${cat.soft};border-color:${cat.accent}"` : '';
    return `<button class="chip" data-group="${group || ''}" aria-pressed="${pressed}" ${style}>${group || '全部'}</button>`;
  }).join('');

  $('#legend-btn').hidden = catKey !== 'food';
  $('#price-legend').innerHTML = PRICE_LEVELS.map((level, index) => `
    <div class="legend-row">${priceLevel({ level: index + 1 })}<b>${level.label}</b><span>${level.note}</span></div>`).join('');

  const cuisines = cat.cuisines || [];
  const cuisineChips = $('#cuisine-chips');
  cuisineChips.hidden = cuisines.length === 0;
  cuisineChips.innerHTML = [null].concat(cuisines).map((cuisine) => {
    const pressed = cuisine === state.cuisine;
    const style = pressed ? `style="background:${cat.soft};border-color:${cat.accent}"` : '';
    return `<button class="chip" data-cuisine="${cuisine || ''}" aria-pressed="${pressed}" ${style}>${cuisine || '全部菜色'}</button>`;
  }).join('');

  const list = placesOf(catKey)
    .filter((place) => !state.group || place.group === state.group)
    .filter((place) => !state.cuisine || place.cuisine === state.cuisine);
  const totalInCat = PLACES.filter((place) => place.cat === catKey).length;

  $('#result').textContent = totalInCat ? `${list.length} 個地點` : '';

  if (!totalInCat) {
    $('#cards').innerHTML = `
      <div class="empty"><div class="big">${cat.icon}</div>
      這裡還空空的<br>之後想到要去的課程、體驗、展覽再加進來</div>`;
  } else if (!list.length) {
    $('#cards').innerHTML = `
      <div class="empty"><div class="big">😴</div>
      沒有符合條件的地方<br>換一天或放寬篩選看看</div>`;
  } else {
    $('#cards').innerHTML = list.map((place) => `
      <button class="card" data-index="${PLACES.indexOf(place)}">
        ${thumbHtml(place, cat)}
        <div class="card-body">
        <div class="card-title"><h3>${place.zh}<span class="en">${place.name}</span></h3><span class="arrow">›</span></div>
        <div class="thai">${place.thai}</div>
        <p class="one">${place.desc}</p>
        <div class="card-foot">
          <div class="tags">${tagHtml(place)}</div>
          <div class="foot-right">${priceLevel(place)}${weekDots(place)}</div>
        </div>
        </div>
      </button>`).join('');
  }

  const notice = $('#notice');
  notice.hidden = !cat.notice;
  notice.textContent = cat.notice;
}

function renderPlace(place) {
  const cat = CATEGORIES[place.cat];
  const root = document.documentElement;
  root.style.setProperty('--accent', cat.accent);
  root.style.setProperty('--soft', cat.soft);

  const image = IMAGES[place.name];
  const hero = image && image.url
    ? `<img src="${image.url}" alt="${place.zh}" onerror="this.replaceWith(Object.assign(document.createElement('span'),{className:'hero-icon',textContent:'${cat.icon}'}))">
       ${image.credit ? `<span class="hero-credit">${image.credit}</span>` : ''}`
    : `<span class="hero-icon">${cat.icon}</span>`;

  const fit = place.fit.length
    ? `<div class="block"><div class="block-title">適合</div><div class="pills">${place.fit.map((item) => `<span class="pill">${item}</span>`).join('')}</div></div>`
    : '';
  const dishes = place.dishes.length
    ? `<div class="block"><div class="block-title">必點</div><div class="pills">${place.dishes.map((item) => `<span class="pill dish">${item}</span>`).join('')}</div></div>`
    : '';

  const infoRows = [
    ['📍', place.location],
    ['📅', weekCircles(place)],
    ['🕐', hoursOnly(place.time) || '時間待確認'],
    ['💰', place.level ? `${priceLevel(place)} ${place.price || ''}` : place.price],
  ].filter(([, value]) => value)
    .map(([icon, value]) => `<div class="info-row"><span>${icon}</span><span>${value}</span></div>`)
    .join('');

  const michelinUrl = place.michelin || (place.bib ? BIB_URL : '');
  const michelin = michelinUrl
    ? `<a class="btn ghost" href="${michelinUrl}" target="_blank" rel="noopener">Michelin 介紹 ↗</a>`
    : '';

  $('#view-place').innerHTML = `
    <div class="hero">
      ${hero}
      <button class="back" id="place-back">← ${cat.name}</button>
    </div>
    <div class="wrap place">
      <div class="tags">${tagHtml(place)}</div>
      <h1>${place.zh}<span class="en">${place.name}</span></h1>
      <div class="thai">${place.thai}</div>
      <p class="desc">${place.desc}</p>
      ${fit}
      ${dishes}
      ${place.note ? `<div class="friend-note">💬 <b>朋友說</b>${place.note}</div>` : ''}
      <div class="info">${infoRows}</div>
      <div class="btns">
        <a class="btn" href="${place.map}" target="_blank" rel="noopener">Google Maps 導航 ↗</a>
        ${michelin}
      </div>
    </div>`;
  $('#place-back').addEventListener('click', () => {
    location.hash = place.cat;
  });
}

function currentPlace() {
  const match = location.hash.match(/^#place-(\d+)$/);
  return match ? PLACES[Number(match[1])] : null;
}

function currentCat() {
  const key = location.hash.slice(1);
  return CATEGORIES[key] ? key : null;
}

function render() {
  const place = currentPlace();
  const catKey = place ? null : currentCat();
  const isHome = !place && !catKey;
  renderDays();
  $('#view-home').hidden = !isHome;
  $('#home-body').hidden = !isHome;
  $('#view-cat').hidden = !catKey;
  $('#cat-body').hidden = !catKey;
  $('#view-place').hidden = !place;
  $('#daybar').hidden = !!place;
  if (place) {
    renderPlace(place);
  } else if (catKey) {
    renderCategory(catKey);
  } else {
    renderTiles();
  }
}

$('#days').addEventListener('click', (event) => {
  const button = event.target.closest('.day');
  if (!button) return;
  state.day = button.dataset.day === 'null' ? null : Number(button.dataset.day);
  render();
});

$('#tiles').addEventListener('click', (event) => {
  const tile = event.target.closest('.tile');
  if (!tile) return;
  state.group = null;
  state.cuisine = null;
  location.hash = tile.dataset.cat;
  window.scrollTo(0, 0);
});

$('#back').addEventListener('click', () => {
  location.hash = '';
});

$('#chips').addEventListener('click', (event) => {
  const chip = event.target.closest('.chip');
  if (!chip) return;
  state.group = chip.dataset.group || null;
  render();
});

$('#cuisine-chips').addEventListener('click', (event) => {
  const chip = event.target.closest('.chip');
  if (!chip) return;
  state.cuisine = chip.dataset.cuisine || null;
  render();
});

$('#cards').addEventListener('click', (event) => {
  const card = event.target.closest('.card');
  if (!card) return;
  location.hash = `place-${card.dataset.index}`;
});

$('#legend-btn').addEventListener('click', () => $('#legend-dialog').showModal());
$('#legend-close').addEventListener('click', () => $('#legend-dialog').close());
$('#legend-dialog').addEventListener('click', (event) => {
  if (event.target === $('#legend-dialog')) $('#legend-dialog').close();
});

window.addEventListener('hashchange', () => {
  window.scrollTo(0, 0);
  render();
});

render();
</script>
</body>
</html>
